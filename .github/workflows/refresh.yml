name: refresh
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: git config user.name bot && git config user.email bot@users.noreply.github.com && git add data.json && (git commit -m refresh && git push || true)
